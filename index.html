.red{background:#c62828}
.orange{background:#f6b51b;color:#111}
.blue{background:#1976d2}
.gray{background:#667085}

.actions{
  display:flex;gap:8px;flex-wrap:wrap;
}
.actions a{text-decoration:none}

.info,.panel{
  background:#fff;border-radius:17px;
  padding:15px;margin:14px 0;
  box-shadow:0 2px 10px #0001;
}
.info h3,.panel h3{margin-top:0}

.tabs{
  display:flex;gap:8px;overflow:auto;

.tab{

  border-radius:99px;padding:9px 14px;

}
.active{background:#137333!important;color:#fff}

.bar{
  display:flex;align-items:center;
  justify-content:space-between;
  gap:8px;margin:15px 0 10px;
}
.bar h2{margin:0}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(175px,1fr));
  gap:12px;
}
.card{
  background:#fff;border-radius:17px;
  padding:12px;box-shadow:0 2px 10px #0001;
  display:flex;flex-direction:column;
}
.product-img{
  width:100%;aspect-ratio:1/1;
  object-fit:cover;border-radius:13px;
  background:#eef6ef;
}
.no-img{
  width:100%;aspect-ratio:1/1;
  border-radius:13px;background:#eef6ef;
  display:flex;align-items:center;justify-content:center;
  font-size:58px;
}
.name{font-weight:900;margin-top:9px;font-size:16px}
.muted{font-size:13px;color:#69736c;margin-top:3px}
.price{
  font-size:19px;font-weight:900;
  color:#137333;margin:7px 0;
}
.card .btn{width:100%;margin-top:auto}

.offer{
  background:#fff4c7;border:1px solid #efd56b;
  border-radius:15px;padding:14px;margin:12px 0;
}
.popular{border:2px solid #f6b51b}
.badge{
  display:inline-block;background:#fff4c7;
  color:#7a5200;border-radius:99px;
  padding:4px 8px;font-size:11px;font-weight:800;
  margin-top:7px;width:max-content;
}

.cart{
  position:fixed;right:15px;bottom:15px;
  z-index:40;background:#f6b51b;color:#111;
  border:0;border-radius:99px;
  padding:14px 18px;font-weight:900;
  cursor:pointer;box-shadow:0 4px 15px #0003;
}

.admin{display:none}
.admin.show{display:block}
.customer.hide{display:none}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:10px;
}
.stat{
  padding:14px;background:#f0f6f1;
  border-radius:12px;
}

.row{
  display:flex;justify-content:space-between;
  align-items:center;gap:10px;
  padding:12px 0;border-bottom:1px solid #eee;
}
.row:last-child{border-bottom:0}

.modal{
  display:none;position:fixed;inset:0;
  background:#0008;z-index:100;
  align-items:center;justify-content:center;
  padding:10px;
}
.modal.show{display:flex}
.sheet{
  background:#fff;width:min(680px,100%);
  max-height:92vh;overflow:auto;
  border-radius:20px;padding:18px;
}
.empty{text-align:center;padding:30px;color:#69736c}
.small{font-size:12px;color:#69736c}
.order-item{padding:8px 0;border-bottom:1px solid #eee}
.image-admin{

.image-preview{

}
footer{text-align:center;color:#69736c;padding:30px 10px}

@media(max-width:600px){

  .search{flex-direction:column}

  .card{padding:10px}

function freshProducts(){
  return seed.map((x,i)=>({
    id:i+1,
    name:x[0],
    cat:x[1],
    unit:x[2],
    emoji:x[3],
    price:0,
    image:"",
    popular:false
  }));
}

let products=JSON.parse(localStorage.getItem("shriProductsImageV1")||"null")||freshProducts();
let cart=JSON.parse(localStorage.getItem("shriCartImageV1")||"{}");
let orders=JSON.parse(localStorage.getItem("shriOrdersImageV1")||"[]");
let offers=JSON.parse(localStorage.getItem("shriOffersImageV1")||"[]");
let active="सभी";
let newImageData="";

const $=id=>document.getElementById(id);

function esc(v){
  return String(v).replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#039;"
  }[m]);
}

function save(){
  try{
    localStorage.setItem("shriProductsImageV1",JSON.stringify(products));
    localStorage.setItem("shriCartImageV1",JSON.stringify(cart));
    localStorage.setItem("shriOrdersImageV1",JSON.stringify(orders));
    localStorage.setItem("shriOffersImageV1",JSON.stringify(offers));
  }catch(e){
    alert("Image बहुत बड़ी है। छोटी/Compressed image इस्तेमाल करें।");
  }
  render();
}

function productImage(p,cls="product-img"){
  if(p.image){
    return `<img class="${cls}" src="${p.image}" alt="${esc(p.name)}">`;
  }
  return `<div class="no-img">${esc(p.emoji||"🛍️")}</div>`;
}

function render(){
  const q=$("search").value.trim().toLowerCase();

  const cats=["सभी",...new Set(products.map(p=>p.cat))];

  $("cats").innerHTML=cats.map(c=>
    `<button class="tab ${c===active?"active":""}"
      onclick='setCategory(${JSON.stringify(c)})'>${esc(c)}</button>`
  ).join("");

  const list=products.filter(p=>
    (active==="सभी"||p.cat===active) &&
    (!q || p.name.toLowerCase().includes(q) || p.cat.toLowerCase().includes(q))
  );

  $("products").innerHTML=list.length ? list.map(p=>`
    <div class="card ${p.popular?"popular":""}">
      ${productImage(p)}
      ${p.popular?`<div class="badge">⭐ Popular</div>`:""}
      <div class="name">${esc(p.name)}</div>
      <div class="muted">${esc(p.cat)} · ${esc(p.unit)}</div>
      <div class="price">₹${p.price}</div>
      <button class="btn" onclick="addCart(${p.id})">🛒 कार्ट में डालें</button>
    </div>
  `).join("") : `<div class="empty">इस नाम का सामान नहीं मिला।</div>`;

  const activeOffers=offers.filter(o=>o.active);
  $("offers").innerHTML=activeOffers.map(o=>
    `<div class="offer">🎁 <b>${esc(o.text)}</b></div>`
  ).join("");

  $("count").textContent=Object.values(cart).reduce((a,b)=>a+b,0);

  $("stats").innerHTML=`
    <div class="stat">कुल सामान<br><b>${products.length}</b></div>
    <div class="stat">कुल ऑर्डर<br><b>${orders.length}</b></div>
    <div class="stat">कुल बिक्री<br><b>₹${orders.reduce((a,o)=>a+Number(o.total||0),0)}</b></div>
  `;

  $("inventory").innerHTML=products.map((p,i)=>`
    <div class="row">
      <div style="display:flex;gap:10px;align-items:center;min-width:0">
        ${p.image
          ?`<img class="image-admin" src="${p.image}" alt="">`
          :`<div class="image-admin" style="display:flex;align-items:center;justify-content:center;font-size:28px">${esc(p.emoji)}</div>`
        }
        <span>
          <b>${i+1}. ${esc(p.name)}</b><br>
          <span class="small">${esc(p.cat)} · ${esc(p.unit)} · ₹${p.price}</span>
        </span>
      </div>

      <span class="actions">
        <button class="btn blue" onclick="changeImage(${i})">📷 Image</button>
        <button class="btn" onclick="editProduct(${i})">✏️</button>
        <button class="btn orange" onclick="togglePopular(${i})">⭐</button>
        <button class="btn red" onclick="deleteProduct(${i})">🗑️</button>
      </span>
    </div>
  `).join("");

  $("orders").innerHTML=orders.length ? orders.slice().reverse().map(o=>`
    <div class="row">
      <span>
        <b>${esc(o.name)}</b><br>
        📱 ${esc(o.phone||"नहीं दिया")}<br>
        📍 ${esc(o.address)}<br>
        🛒 ${esc(o.items)}<br>
        ${o.note?`📝 ${esc(o.note)}<br>`:""}
        <span class="small">${esc(o.date)}</span>
      </span>
      <b>₹${o.total}</b>

  $("offerAdmin").innerHTML=offers.length ? offers.map((o,i)=>`
    <div class="row">
      <span>🎁 ${esc(o.text)}<br>
      <span class="small">${o.active?"चालू":"बंद"}</span></span>

        <button class="btn" onclick="toggleOffer(${i})">${o.active?"बंद":"चालू"}</button>

}

function setCategory(c){
  active=c;
  render();
}

/* IMAGE */
function compressImage(file,callback){
  if(!file) return;

  const reader=new FileReader();

  reader.onload=e=>{
    const img=new Image();

    img.onload=()=>{
      const max=700;
      let w=img.width,h=img.height;

      if(w>h && w>max){
        h=Math.round(h*max/w);
        w=max;
      }else if(h>max){
        w=Math.round(w*max/h);
        h=max;
      }

      const canvas=document.createElement("canvas");
      canvas.width=w;
      canvas.height=h;

      const ctx=canvas.getContext("2d");
      ctx.drawImage(img,0,0,w,h);

      callback(canvas.toDataURL("image/jpeg",0.72));
    };

    img.src=e.target.result;
  };

  reader.readAsDataURL(file);
}

function previewNewImage(e){
  const file=e.target.files[0];
  if(!file)return;

  compressImage(file,data=>{
    newImageData=data;
    $("newPreview").src=data;
    $("newPreview").style.display="block";
  });
}

function changeImage(i){
  $("modalTitle").textContent="📷 "+products[i].name+" की Image";

  $("modalBody").innerHTML=`
    <input id="changeImageFile" class="input"
      type="file" accept="image/*" capture="environment">
    <br><br>
    <img id="changePreview" class="image-preview" alt="Preview">
    <br><br>
    <div class="actions">
      <button class="btn" onclick="saveChangedImage(${i})">💾 Image Save करें</button>
      <button class="btn red" onclick="removeImage(${i})">🗑️ Image हटाएँ</button>
    </div>
  `;

  $("modal").classList.add("show");

  $("changeImageFile").addEventListener("change",e=>{
    const file=e.target.files[0];
    if(!file)return;

    compressImage(file,data=>{
      $("changePreview").src=data;
      $("changePreview").style.display="block";
      $("changePreview").dataset.image=data;
    });
  });
}

function saveChangedImage(i){
  const img=$("changePreview").dataset.image;

  if(!img){
    alert("पहले Image चुनें या Camera से Photo लें");
    return;
  }

  products[i].image=img;
  save();
  closeModal();
  alert("✅ Product Image Save हो गई");
}

function removeImage(i){
  products[i].image="";
  save();
  closeModal();
}

/* PRODUCT */
function addProduct(){
  const name=$("pn").value.trim();
  const cat=$("pc").value.trim()||"किराना";
  const unit=$("pu").value.trim()||"नग";
  const price=Math.max(0,Number($("pp").value)||0);
  const emoji=$("pe").value.trim()||"🛍️";

  if(!name){
    alert("सामान का नाम भरें");
    return;
  }

  products.push({
    id:Date.now(),
    name,cat,unit,price,emoji,
    image:newImageData,
    popular:false
  });

  ["pn","pc","pu","pp","pe","pimage"].forEach(id=>$(id).value="");
  newImageData="";
  $("newPreview").style.display="none";
  $("newPreview").src="";

  save();
  alert("✅ नया सामान जोड़ दिया गया");
}

function editProduct(i){
  const p=products[i];

  const name=prompt("सामान का नाम",p.name);
  if(name===null)return;

  const cat=prompt("कैटेगरी",p.cat);
  if(cat===null)return;

  const unit=prompt("यूनिट",p.unit);
  if(unit===null)return;

  const price=prompt("प्राइस ₹",p.price);
  if(price===null)return;

  const emoji=prompt("Image न हो तो Emoji",p.emoji);
  if(emoji===null)return;

  p.name=name.trim()||p.name;
  p.cat=cat.trim()||p.cat;
  p.unit=unit.trim()||p.unit;
  p.price=Math.max(0,Number(price)||0);
  p.emoji=emoji.trim()||p.emoji;

  save();
  alert("✅ सामान अपडेट हो गया");
}

function togglePopular(i){
  products[i].popular=!products[i].popular;
  save();
}

function deleteProduct(i){
  if(confirm("क्या यह सामान हटाना है?")){
    delete cart[products[i].id];
    products.splice(i,1);
    save();
  }
}

/* CART */
function addCart(id){
  cart[id]=(cart[id]||0)+1;
  save();
}

function openCart(){
  $("modalTitle").textContent="🛒 आपका कार्ट";

  const ids=Object.keys(cart);
  let total=0;

  if(!ids.length){
    $("modalBody").innerHTML=`<div class="empty">आपका कार्ट खाली है।</div>`;
    $("modal").classList.add("show");
    return;
  }

  let html=ids.map(id=>{
    const p=products.find(x=>x.id==id);
    if(!p)return "";

    const q=cart[id];
    total+=Number(p.price)*q;

    return `
      <div class="row">
        <span>
          <b>${esc(p.name)}</b><br>
          ₹${p.price} × ${q}
        </span>
        <span>
          <button class="btn" onclick="minusCart(${p.id})">−</button>
          ${q}
          <button class="btn" onclick="plusCart(${p.id})">+</button>
        </span>
      </div>
    `;
  }).join("");

  html+=`
    <h3>कुल: ₹${total}</h3>

    <input id="cn" class="input" placeholder="👤 आपका नाम">
    <br><br>

    <input id="cp" class="input" type="tel" inputmode="numeric"
      placeholder="📱 आपका मोबाइल नंबर">
    <br><br>

    <input id="ca" class="input" placeholder="📍 डिलीवरी पता">
    <br><br>

    <textarea id="cnote" class="input" style="min-height:90px"
      placeholder="📝 कोई Note / विशेष निर्देश"></textarea>
    <br><br>

    <button class="btn" style="width:100%"
      onclick="placeOrder(${total})">
      📱 WhatsApp पर ऑर्डर करें
    </button>
  `;

  $("modalBody").innerHTML=html;
  $("modal").classList.add("show");
}

function plusCart(id){
  cart[id]=(cart[id]||0)+1;
  save();
  openCart();
}

function minusCart(id){
  cart[id]--;
  if(cart[id]<=0)delete cart[id];
  save();
  openCart();
}

function placeOrder(total){
  const name=$("cn").value.trim();
  const phone=$("cp").value.trim();
  const address=$("ca").value.trim();
  const note=$("cnote").value.trim();

  if(!name||!phone||!address){
    alert("कृपया नाम, मोबाइल नंबर और पता भरें");
    return;
  }

  if(phone.replace(/\D/g,"").length<10){
    alert("कृपया सही मोबाइल नंबर भरें");
    return;
  }

  const items=Object.keys(cart).map(id=>{
    const p=products.find(x=>x.id==id);
    return p?`${p.name} × ${cart[id]}`:"";
  }).filter(Boolean).join(", ");

  orders.push({
    name,
    phone,
    address,
    note,
    items,
    total:Number(total),
    date:new Date().toLocaleString("hi-IN")
  });

  cart={};
  save();
  closeModal();

  const text=`नमस्ते, श्री हरि किराना दुकान में ऑर्डर:

नाम: ${name}
मोबाइल नंबर: ${phone}
पता: ${address}

सामान:
${items}

कुल राशि: ₹${total}

Note: ${note||"कोई Note नहीं"}`;

  window.open(
    "https://wa.me/919329890431?text="+encodeURIComponent(text),
    "_blank"
  );
}

/* OFFER */
function addOffer(){
  const text=$("offerText").value.trim();

  if(!text){
    alert("पहले ऑफर लिखें");
    return;
  }

  offers.push({text,active:true});
  $("offerText").value="";
  save();
}

function toggleOffer(i){
  offers[i].active=!offers[i].active;
  save();
}

function deleteOffer(i){
  offers.splice(i,1);
  save();
}

/* ADMIN */
function openAdmin(){
  const pin=prompt("Admin PIN डालें");

  if(pin!==ADMIN_PIN){
    alert("❌ गलत PIN");
    return;
  }

  $("customer").classList.add("hide");
  $("admin").classList.add("show");
  render();
}

function closeAdmin(){
  $("admin").classList.remove("show");
  $("customer").classList.remove("hide");
}

/* MODAL */
function closeModal(){
  $("modal").classList.remove("show");
}

$("modal").addEventListener("click",e=>{
  if(e.target===$("modal"))closeModal();
});

$("search").addEventListener("input",render);

render();
</script>

</body>
</html>
