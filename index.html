<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#137333"><title>श्री हरि किराना दुकान</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f5f7f5;color:#182019}
header{background:#137333;color:#fff;padding:13px 15px;position:sticky;top:0;z-index:10}.head{max-width:1150px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:20px;font-weight:800}
.wrap{max-width:1150px;margin:auto;padding:16px}.hero{background:linear-gradient(135deg,#137333,#2e9e55);color:#fff;border-radius:20px;padding:25px;margin-bottom:16px}.hero h1{margin:0 0 8px;font-size:30px}
.search{display:flex;gap:8px;margin-top:15px}.search input,.input{width:100%;padding:12px;border:1px solid #d5ddd7;border-radius:10px;font-size:15px}.search input{border:0}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer;background:#137333;color:#fff}.white{background:#fff;color:#137333}.red{background:#c62828}.orange{background:#f6b51b;color:#111}
.tabs{display:flex;gap:8px;overflow:auto;padding:2px 0 12px}.tab{border:1px solid #d7ded8;background:#fff;border-radius:99px;padding:9px 14px;white-space:nowrap}.active{background:#137333!important;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}.card,.panel{background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 8px #0001}.emoji{text-align:center;font-size:42px;background:#eef6ef;border-radius:12px;padding:10px}.name{font-weight:800;margin-top:8px}.price{font-size:18px;font-weight:900;color:#137333;margin:5px 0}.muted{font-size:13px;color:#69736c}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:15px 0 10px}.cart{position:fixed;right:15px;bottom:15px;background:#f6b51b;color:#111;border:0;border-radius:99px;padding:14px 18px;font-weight:900;z-index:20}
.admin{display:none}.admin.show{display:block}.customer.hide{display:none}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat{padding:15px;background:#f0f6f1;border-radius:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid #eee}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:30;align-items:flex-end;justify-content:center}.modal.show{display:flex}.sheet{background:#fff;width:min(650px,100%);max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px}footer{text-align:center;color:#69736c;padding:30px 10px}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:20px}}
</style></head>
<body>
<header><div class="head"><div class="brand">🛒 श्री हरि किराना दुकान</div><div>📞 9329890431 · खुरई</div></div></header>
<main class="wrap">
<section id="customer" class="customer">
<div class="hero"><h1>घर का सामान, अब आसानी से</h1><div>खुरई में आपकी अपनी किराना दुकान</div>
<div class="search"><input id="search" placeholder="सामान खोजें..."><button class="btn white" onclick="openCart()">कार्ट 🛒</button></div></div>
<div id="cats" class="tabs"></div><div class="bar"><h2>सामान</h2><button class="btn" onclick="openAdmin()">🔐 एडमिन</button></div><div id="products" class="grid"></div>
</section>
<section id="admin" class="admin">
<div class="bar"><h2>🔐 मजबूत एडमिन पैनल</h2><button class="btn" onclick="closeAdmin()">ग्राहक साइट</button></div>
<div class="panel"><h3>दुकान डैशबोर्ड</h3><div id="stats" class="stats"></div></div>
<div class="panel"><h3>सामान जोड़ें</h3><input id="pn" class="input" placeholder="सामान का नाम"><input id="pc" class="input" placeholder="श्रेणी"><input id="pp" class="input" type="number" placeholder="कीमत ₹"><input id="ps" class="input" type="number" placeholder="स्टॉक"><input id="pe" class="input" placeholder="इमोजी"><button class="btn" onclick="addProduct()">सेव करें</button></div>
<div class="panel"><h3>ऑर्डर इतिहास</h3><div id="orders"></div></div>
<div class="panel"><h3>स्टॉक प्रबंधन</h3><div id="inventory"></div></div>
</section></main>
<button class="cart" onclick="openCart()">🛒 कार्ट (<span id="count">0</span>)</button>
<footer>© 2026 श्री हरि किराना दुकान · खुरई · 9329890431</footer>
<div id="modal" class="modal"><div class="sheet"><div class="bar"><h2 id="mt">कार्ट</h2><button class="btn" onclick="closeModal()">✕</button></div><div id="mb"></div></div></div>
<script>
const seed=[
["आशीर्वाद आटा 5 किलो","आटा और चावल",280,20,"🌾"],["इंडिया गेट चावल 5 किलो","आटा और चावल",420,15,"🍚"],["तूर दाल 1 किलो","दाल",165,30,"🫘"],["फॉर्च्यून तेल 1 लीटर","तेल",145,25,"🫗"],["टाटा नमक 1 किलो","किराना",28,50,"🧂"],["चीनी 1 किलो","किराना",48,40,"🍬"],["मैगी","नाश्ता",14,60,"🍜"],["पारले-जी बिस्कुट","बिस्कुट",10,80,"🍪"],["चाय 250 ग्राम","पेय पदार्थ",110,25,"☕"],["नहाने का साबुन","पर्सनल केयर",35,35,"🧼"]];
let products=JSON.parse(localStorage.getItem("shriProductsPro")||"null")||seed.map(x=>({name:x[0],cat:x[1],price:x[2],stock:x[3],emoji:x[4]}));
let cart=JSON.parse(localStorage.getItem("shriCartPro")||"{}"),orders=JSON.parse(localStorage.getItem("shriOrdersPro")||"[]"),active="सभी";
const save=()=>{localStorage.setItem("shriProductsPro",JSON.stringify(products));localStorage.setItem("shriCartPro",JSON.stringify(cart));localStorage.setItem("shriOrdersPro",JSON.stringify(orders));render()};
function render(){
let cats=["सभी",...new Set(products.map(p=>p.cat))];catsEl.innerHTML=cats.map(c=>`<button class="tab ${c===active?"active":""}" onclick="active=${JSON.stringify(c)};render()">${c}</button>`).join("");
let q=search.value.toLowerCase(), list=products.filter(p=>(active==="सभी"||p.cat===active)&&p.name.toLowerCase().includes(q));
productsEl.innerHTML=list.map(p=>`<div class="card"><div class="emoji">${p.emoji}</div><div class="name">${p.name}</div><div class="muted">${p.cat} · स्टॉक ${p.stock}</div><div class="price">₹${p.price}</div><button class="btn" style="width:100%" ${p.stock?"":"disabled"} onclick="addCart(${JSON.stringify(p.name)})">${p.stock?"कार्ट में डालें":"स्टॉक खत्म"}</button></div>`).join("");
count.textContent=Object.values(cart).reduce((a,b)=>a+b,0);
stats.innerHTML=`<div class="stat">कुल सामान<br><b>${products.length}</b></div><div class="stat">कुल स्टॉक<br><b>${products.reduce((a,p)=>a+p.stock,0)}</b></div><div class="stat">कुल ऑर्डर<br><b>${orders.length}</b></div><div class="stat">बिक्री<br><b>₹${orders.reduce((a,o)=>a+o.total,0)}</b></div>`;
orders.innerHTML=orders.length?orders.slice().reverse().map((o,i)=>`<div class="row"><span><b>${o.name}</b><br>${o.address}<br><span class="muted">${o.date}</span></span><b>₹${o.total}</b></div>`).join(""):"अभी कोई ऑर्डर नहीं।";
inventory.innerHTML=products.map((p,i)=>`<div class="row"><span><b>${p.name}</b><br>₹${p.price}</span><span><button class="btn" onclick="stock(${i},-1)">−</button> ${p.stock} <button class="btn" onclick="stock(${i},1)">+</button> <button class="btn red" onclick="del(${i})">हटाएँ</button></span></div>`).join("");
}
function addCart(n){let p=products.find(x=>x.name===n);if(p&&p.stock){cart[n]=(cart[n]||0)+1;save()}}
function openCart(){let keys=Object.keys(cart),total=0;let b=keys.length?keys.map(k=>{let p=products.find(x=>x.name===k),q=cart[k];total+=p.price*q;return `<div class="row"><span>${p.emoji} <b>${p.name}</b><br>₹${p.price} × ${q}</span><span><button class="btn" onclick="cart[k]--;if(cart[k]<=0)delete cart[k];save();openCart()">−</button> ${q} <button class="btn" onclick="addCart(k);openCart()">+</button></span></div>`}).join(""):`<p>कार्ट खाली है।</p>`;if(keys.length)b+=`<h3>कुल: ₹${total}</h3><input id="cn" class="input" placeholder="आपका नाम"><input id="ca" class="input" placeholder="डिलीवरी पता"><button class="btn" style="width:100%" onclick="placeOrder(${total})">ऑर्डर सेव करें + WhatsApp</button>`;mb.innerHTML=b;modal.classList.add("show")}
function placeOrder(total){let n=cn.value.trim(),a=ca.value.trim();if(!n||!a){alert("नाम और पता भरें");return}orders.push({name:n,address:a,total,date:new Date().toLocaleString("hi-IN")});for(let k in cart){let p=products.find(x=>x.name===k);if(p)p.stock=Math.max(0,p.stock-cart[k])}let text=`नमस्ते, श्री हरि किराना दुकान में ऑर्डर:%0Aनाम: ${encodeURIComponent(n)}%0Aपता: ${encodeURIComponent(a)}%0Aकुल: ₹${total}`;cart={};save();closeModal();window.open("https://wa.me/919329890431?text="+text,"_blank")}
function closeModal(){modal.classList.remove("show")}function openAdmin(){customer.classList.add("hide");admin.classList.add("show")}function closeAdmin(){admin.classList.remove("show");customer.classList.remove("hide")}
function addProduct(){let n=pn.value.trim(),c=pc.value.trim()||"किराना",p=+pp.value,s=+ps.value,e=pe.value||"🛍️";if(!n||!p){alert("नाम और कीमत भरें");return}products.push({name:n,cat:c,price:p,stock:s,emoji:e});pn.value=pc.value=pp.value=ps.value=pe.value="";save()}
function stock(i,n){products[i].stock=Math.max(0,products[i].stock+n);save()}function del(i){if(confirm("सामान हटाएँ?")){products.splice(i,1);save()}}
const catsEl=document.getElementById("cats"),productsEl=document.getElementById("products"),search=document.getElementById("search"),count=document.getElementById("count"),stats=document.getElementById("stats"),ordersEl=document.getElementById("orders"),inventory=document.getElementById("inventory"),modal=document.getElementById("modal"),mb=document.getElementById("mb"),customer=document.getElementById("customer"),admin=document.getElementById("admin"),cn=document.getElementById("cn"),ca=document.getElementById("ca");
search.addEventListener("input",render);render();
</script></body></html>
